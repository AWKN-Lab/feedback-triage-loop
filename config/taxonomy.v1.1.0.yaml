version: 1.1.0
default_queue: knowledge
queues:
  knowledge:
    description: 'The answer exists but the bot could not reach it: the knowledge
      base has no entry, the policy text is stale, or the FAQ simply does not cover
      the case. Fix by writing or updating knowledge.

      '
    signals:
    - no_faq_entry
    - missing_answer
    - unknown_product
    - stale_policy
    cost: low
    review: auto
  prompt:
    description: 'The knowledge was there and reachable, but the bot did not use it:
      the instructions drifted, the tone was wrong, or a valid request was refused.
      Fix by changing the prompt or the routing rules.

      '
    signals:
    - prompt_drift
    - wrong_tone
    - refused_valid_request
    - wrong_intent_picked
    cost: low
    review: auto
  model:
    description: 'The bot had the knowledge and the instructions and still could not
      do the job: timeouts, malformed output, or a capability the model does not have.
      Fix by changing the model, the adapter or the surrounding system.

      '
    signals:
    - timeout
    - wrong_output_format
    - capability_gap
    - hallucinated_value
    cost: high
    review: human
