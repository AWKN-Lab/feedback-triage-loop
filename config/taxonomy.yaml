# Failure taxonomy: which queue a trajectory's signals belong to.
#
# The mapping is data, not code, so a team can retune it without touching the
# router. Every signal a trajectory can carry should appear in exactly one
# queue; anything unrecognised falls back to `default_queue`.
#
# Note: this is the taxonomy as it stands today, including one mis-mapping
# (`stale_policy` is filed under prompt although it is a knowledge problem).
# The feedback loop in evidence/run.sh is what finds and corrects it — that is
# the point of the demo, not a defect in this file.

version: "1.0.0"

default_queue: knowledge

queues:
  knowledge:
    description: >
      The answer exists but the bot could not reach it: the knowledge base has
      no entry, the policy text is stale, or the FAQ simply does not cover the
      case. Fix by writing or updating knowledge.
    signals:
      - no_faq_entry
      - missing_answer
      - unknown_product
    cost: low
    review: auto          # cheap, low risk: a reviewer may approve it directly

  prompt:
    description: >
      The knowledge was there and reachable, but the bot did not use it: the
      instructions drifted, the tone was wrong, or a valid request was
      refused. Fix by changing the prompt or the routing rules.
    signals:
      - prompt_drift
      - wrong_tone
      - refused_valid_request
      - wrong_intent_picked
      - stale_policy
    cost: low
    review: auto

  model:
    description: >
      The bot had the knowledge and the instructions and still could not do
      the job: timeouts, malformed output, or a capability the model does not
      have. Fix by changing the model, the adapter or the surrounding system.
    signals:
      - timeout
      - wrong_output_format
      - capability_gap
      - hallucinated_value
    cost: high
    review: human         # expensive and risky: a human must approve it
